# ==============================================================================
# MARVEL'S BASKET — REDIS CONFIGURATION (DEVELOPMENT & LOCAL INFRASTRUCTURE)
# ==============================================================================

# Network bindings
bind 0.0.0.0
protected-mode no
port 6379

# General
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice

# Persistence (Append Only File + Snapshotting)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Working Directory
dir /data
